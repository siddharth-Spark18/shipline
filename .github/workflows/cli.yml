name: cli

on:
  # Branch pushes are covered by the pull_request run; only main is built on push, so one push to a PR
  # branch starts one run, not two (macOS runners are scarce).
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/ui/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/ui/**'
      - '.github/workflows/cli.yml'

# A new push to the same PR (or to main) cancels its older, now outdated run.
concurrency:
  group: cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The vendored hook scripts and `init` must keep working on Node 18 (engines.node >=18).
  # Runs the Phase 0 tests only: packages/cli/test/*.test.mjs.
  node18:
    name: hooks (Node 18, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows: keep LF in the checkout so the fixtures and templates match byte for byte.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: pnpm
      # Installing only the CLI keeps Node 18 away from the UI's build tooling, which needs Node 20.
      - run: pnpm install --frozen-lockfile --filter ./packages/cli
      - run: pnpm --filter ./packages/cli test:hooks

  # Everything else needs Node 20: the UI server tests, the browser package and the bundle size budget.
  node20:
    name: cli + ui (Node 20, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows: keep LF in the checkout so the fixtures and templates match byte for byte.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/cli test
      - run: pnpm --filter @shipline/ui typecheck
      # Limited to new code so it doesn't reformat the templates or fail on existing files.
      - if: runner.os == 'Linux'
        run: pnpm exec prettier --check packages/ui/src packages/cli/src/ui
      # Build plus the 400 KB gzip size check (check-ui.mjs).
      - run: node packages/cli/scripts/build-ui.mjs
