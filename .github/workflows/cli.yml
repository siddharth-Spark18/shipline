name: cli

on:
  # Only pull requests: with "Require branches to be up to date" on main (ruleset), every merged result has passed
  # here first, so main isn't built again on push, and the publish workflow tests once more before publishing.
  # No path filter on the trigger: the `ci` job below is the required check and must report on every PR, so the
  # `changes` job decides whether the test matrix runs.
  pull_request:

# A new push to the same PR cancels its older, now outdated run.
concurrency:
  group: cli-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Whether the PR touches the CLI, the UI, the workspace's dependency files or these workflows (the test matrix is
  # skipped otherwise). The root package.json, pnpm-lock.yaml and pnpm-workspace.yaml decide what gets installed, so a
  # dependency-only PR (e.g. a lockfile bump) must run the tests too.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" -q '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^(packages/cli/|packages/ui/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/(cli|publish)\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Every supported Node line (engines.node >=22): 22 and 24 are maintenance LTS, 26 is the active LTS.
  # Ubuntu runs all three; macOS and Windows run the oldest and newest (macOS runners are scarce).
  test:
    name: test (Node ${{ matrix.node }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
        exclude:
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      # Windows: keep LF in the checkout so the fixtures and templates match byte for byte.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/cli test
      - run: pnpm --filter @shipline/ui typecheck
      # Limited to new code so it doesn't reformat the templates or fail on existing files.
      - if: runner.os == 'Linux' && matrix.node == 26
        run: pnpm exec prettier --check packages/ui/src packages/cli/src/ui
      # Build plus the 400 KB gzip size check (check-ui.mjs).
      - run: node packages/cli/scripts/build-ui.mjs

  # The one required status check (main's ruleset): passes when the tests passed or were skipped (no code changes),
  # fails when any test job failed or was cancelled.
  ci:
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes: ${{ needs.changes.result }}, test: ${{ needs.test.result }}"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          case "${{ needs.test.result }}" in success|skipped) ;; *) exit 1 ;; esac
