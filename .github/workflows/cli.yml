name: cli

on:
  # Branch pushes are covered by the pull_request run; only main is built on push, so one push to a PR
  # branch starts one run, not two (macOS runners are scarce).
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/ui/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/ui/**'
      - '.github/workflows/cli.yml'

# A new push to the same PR (or to main) cancels its older, now outdated run.
concurrency:
  group: cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Every supported Node line (engines.node >=22): 22 and 24 are maintenance LTS, 26 is the active LTS.
  # Ubuntu runs all three; macOS and Windows run the oldest and newest (macOS runners are scarce).
  test:
    name: test (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
        exclude:
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      # Windows: keep LF in the checkout so the fixtures and templates match byte for byte.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/cli test
      - run: pnpm --filter @shipline/ui typecheck
      # Limited to new code so it doesn't reformat the templates or fail on existing files.
      - if: runner.os == 'Linux' && matrix.node == 26
        run: pnpm exec prettier --check packages/ui/src packages/cli/src/ui
      # Build plus the 400 KB gzip size check (check-ui.mjs).
      - run: node packages/cli/scripts/build-ui.mjs
