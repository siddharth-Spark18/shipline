name: publish

# Publishes @forgeyard/shipline to npm when a v<major>.<minor>.<patch> tag is pushed.
# Uses npm trusted publishing (OIDC, no token): the package's Settings → Trusted publishing on npmjs.com must name this
# repo and this workflow file (publish.yml). Trusted publishing needs npm 11.5.1+, so this job runs on Node 24.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/cli/package.json version v${version}" >&2
            exit 1
          fi

      - name: CHANGELOG.md must have a heading for this version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if ! grep -qF "## [${version}]" packages/cli/CHANGELOG.md; then
            echo "packages/cli/CHANGELOG.md has no '## [${version}]' heading. Add the release notes before tagging." >&2
            exit 1
          fi

      # Every hash of the templates being published must be recorded (hash-templates.mjs was run). A release that
      # changes no template adds no entry, so this checks the hashes rather than an entry for the version.
      - name: known-hashes.json must record every current template hash
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { templateHashes } from './packages/cli/src/hashes.mjs';
            const known = JSON.parse(readFileSync('./packages/cli/src/known-hashes.json', 'utf8'));
            const missing = Object.entries(templateHashes()).filter(([p, h]) => !(known[p] && known[p][h])).map(([p]) => p);
            if (missing.length) {
              console.error('packages/cli/src/known-hashes.json is missing the current hash of: ' + missing.join(', ') + '. Run: node packages/cli/scripts/hash-templates.mjs');
              process.exit(1);
            }
          "

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No dependency cache in the release job: a poisoned cache must never reach what gets published.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/cli test
      - run: pnpm --filter @shipline/ui typecheck

      # A version already on npm (1.0.0 was published by hand to create the package) is not published again.
      - name: Skip a version that is already published
        id: published
        working-directory: packages/cli
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@forgeyard/shipline@${version}" version >/dev/null 2>&1; then
            echo "@forgeyard/shipline@${version} is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # prepack builds ui-dist.
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        working-directory: packages/cli
        run: npm publish --access public --provenance
