# Shipline config. Edit by hand or run /shipline-setup in Claude Code.

# {key} = ticket key (Jira key, or issue-123 for GitHub; dropped when there is no ticket), {slug} = short task name, {type} = workflow id.
branch_pattern: "{type}/{key}-{slug}"

# Where tickets live: none | github | jira. With none (the default) the ticket stage is skipped. Jira is read
# through the Atlassian MCP when it is connected; GitHub Issues through the `gh` CLI. Shipline ships no tracker
# code and only reads tickets. Any other value skips the ticket stage too.
tracker: none

# How often Claude asks before moving to the next stage: standard | light.
# standard: it asks at every stage marked confirm_to_advance in the workflows.
# light: it asks only at stages also marked `checkpoint: true` (plan approval in Feature, root cause in Bugfix);
# the other stages advance on the deterministic checks. A workflow with no checkpoint then never asks to advance.
# Always asked in both modes: skipping a required stage, finishing with failed checks, and the scope question.
confirmations: standard

# Optional. The verify stage runs only the commands you set here. `init` fills them in from the repo's files.
commands:
  test: ""
  lint: ""
  build: ""

# Optional. Names of this repo's own skills (.claude/skills/<name>) that Claude may use at any stage.
skills: []

# Optional. The pull-request check (.github/workflows/shipline.yml, added from `init` or Setup, CI check) reads this.
# missing_block: what happens when the PR description has no Shipline summary: fail-unless-label | warn | fail
# stale_checks: what happens when the checks in the summary ran on different code than the PR's: warn | fail
# The check runs the checker and reads this file from the PR's base branch, so a PR can't relax its own check
# (the PR that first adds Shipline runs its own copy). Branch protection and CODEOWNERS close the rest (README, CI check).
ci:
  missing_block: fail-unless-label
  # The PR label that lets a PR without a summary pass (with fail-unless-label).
  skip_label: shipline:skip
  stale_checks: warn

# Guardrails: these run inside Claude Code's hooks, in every stage and with or without a task. They stop mistakes,
# not a determined user; for hard limits use Claude Code's sandbox and managed settings (see the README, Guardrails).
# Each rail is deny (the call is refused), ask (Claude Code's own permission prompt shows) or off. A rail left out
# uses its default. Edit here or in Setup, Guardrails.
rails:
  # git push --force (or +branch, --delete) to the default branch, and git branch -D on it.
  force_push_default: deny
  # Any git push to the default branch (an explicit main, or a bare push while on it).
  push_default: ask
  # curl or wget piped into sh, bash, python, node and the like.
  pipe_to_shell: deny
  # cat, grep, printenv and friends on .env, keys, ~/.ssh, ~/.aws and other credential files, or echoing a token.
  print_credentials: deny
  # The Read tool on those same credential files.
  read_credentials: ask
  # kubectl apply, terraform apply, fly deploy, npm run deploy and the like.
  deploy: ask
  # prisma migrate deploy, rails db:migrate, alembic upgrade and the like.
  migrate: ask
  # Edits to .claude/**, .shipline/**, CLAUDE.md and .mcp.json.
  agent_config: ask

# Extra commands that count as a deploy or a migration (plain prefixes, for example "make ship").
rails_commands:
  deploy: []
  migrate: []

# Files that need a permission prompt to change, in any stage (globs relative to the repo root).
protected_paths:
  - migrations/**
  - db/migrate/**
  - prisma/migrations/**
  - alembic/versions/**
  - infra/**
  - terraform/**
  - '**/*.tf'
  - k8s/**
  - helm/**
  - '**/Dockerfile*'
  - '**/docker-compose*'
  - .github/workflows/**
  - .gitlab-ci.yml
  - .circleci/**
  - Jenkinsfile
  - package-lock.json
  - pnpm-lock.yaml
  - yarn.lock
  - poetry.lock
  - Cargo.lock
  - go.sum

# At Verify, `stage.mjs check` lists the test, lint and CI files the change edits and the files outside the plan's
# "Files to touch"; finishing the stage then needs the developer's answer, and the PR summary shows it.
# sensitive_extra: more globs to treat like test, lint and CI files.
scope_check:
  enabled: true
  sensitive_extra: []

# Set to `done` by /shipline-setup (a top-level key `setup: done`) once the rules have been tailored to this repo.
# Until then Shipline reminds you that it is using its default rules.
