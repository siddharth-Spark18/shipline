# Bugfix workflow (a default; edit freely or via /shipline-setup). See feature.yml for field docs.
id: bugfix
name: Bugfix
description: something is broken and needs fixing
stages:
  - id: ticket
    name: Ticket
    artifact: ticket.md
    optional: true
    enforcement: guide
    confirm_to_advance: false
  - id: reproduce
    name: Reproduce
    artifact: reproduction.md
    enforcement: guide
    confirm_to_advance: false
  - id: root_cause
    name: Root cause
    artifact: root-cause.md
    agent: researcher
    sections: [Cause, Evidence]
    enforcement: block
    confirm_to_advance: true
    checkpoint: true
    blocks:
      - tools: 'Edit|Write|MultiEdit|NotebookEdit'
  - id: fix
    name: Fix
    artifact: fix.md
    agent: builder
    enforcement: guide
    confirm_to_advance: false
  - id: verify
    name: Verify
    artifact: verification.md
    agent: qa-bug-hunter
    checks: true
    sections: [Checklist]
    enforcement: block
    confirm_to_advance: true
    blocks:
      - actions: [commit, pr]
  - id: pr
    name: Commit and PR
    artifact: pr.md
    agent: builder
    enforcement: guide
    confirm_to_advance: false
