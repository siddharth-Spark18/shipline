# Docs workflow: documentation changes (offered at install; edit freely or via /shipline-setup). See feature.yml for field docs.
# The write stage blocks edits outside the docs paths listed in allow_paths until it is done.
id: docs
name: Docs
description: write or update documentation; source files stay untouched
stages:
  - id: ticket
    name: Ticket
    artifact: ticket.md
    optional: true
    enforcement: guide
    confirm_to_advance: false
  - id: outline
    name: Outline
    artifact: outline.md
    sections: [Audience, Outline]
    enforcement: guide
    confirm_to_advance: true
    checkpoint: true
  - id: write
    name: Write
    artifact: writing.md
    agent: builder
    enforcement: block
    confirm_to_advance: false
    blocks:
      - tools: 'Edit|Write|MultiEdit'
        allow_paths: ['docs/**', '**/*.md', '**/*.mdx']
  - id: review
    name: Review
    artifact: review.md
    sections: [Checklist]
    enforcement: block
    confirm_to_advance: true
    blocks:
      - actions: [commit, pr]
  - id: pr
    name: Commit and PR
    artifact: pr.md
    agent: builder
    enforcement: guide
    confirm_to_advance: false
