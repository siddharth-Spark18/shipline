# Feature workflow. Stage fields:
#   id, name, artifact (file in the task folder that must exist to finish the stage),
#   optional (may be skipped), condition: ui_only (runs only when the task is flagged as UI work),
#   agent (suggested subagent), confirm_to_advance (ask the developer before moving on),
#   enforcement: guide | warn | block, blocks (what is held back until THIS stage is done),
#   sections (headings the artifact must contain, each with some text under it, before the stage can finish),
#   checks: true (the stage can't finish until `stage.mjs check` has run the test, lint and build commands on the
#   current code and they passed, or the developer accepted the failures).
# A "blocks" entry is { tools: 'Edit|Write', allow_paths: [globs] }, { bash: 'regex' } or { actions: [...] }.
# actions names what to hold back, matched on the parsed command (so `git -c x commit`, `cd sub && git commit` and
# `npm run release` are all caught): commit, push, pr, merge, release, deploy, migrate.
# Task files (manifest and artifacts) live outside the repo, so file blocks never apply to them.
id: feature
name: Feature
description: new functionality or a change in behavior
stages:
  - id: ticket
    name: Ticket
    artifact: ticket.md
    optional: true
    enforcement: guide
    confirm_to_advance: false
  - id: feasibility
    name: Feasibility
    artifact: feasibility.md
    agent: researcher
    sections: [Risks]
    enforcement: guide
    confirm_to_advance: false
  - id: questions
    name: Open questions
    artifact: questions.md
    enforcement: guide
    confirm_to_advance: true
  - id: plan
    name: Plan
    artifact: plan.md
    agent: planner
    sections: [Scope, Files to touch, Verification]
    enforcement: block
    confirm_to_advance: true
    blocks:
      - tools: 'Edit|Write|MultiEdit|NotebookEdit'
  - id: wireframes
    name: Wireframes
    artifact: wireframes.html
    agent: wireframe-proposer
    condition: ui_only
    enforcement: guide
    confirm_to_advance: true
  - id: implement
    name: Implement
    artifact: implementation.md
    agent: builder
    enforcement: guide
    confirm_to_advance: false
  - id: verify
    name: Verify
    artifact: verification.md
    agent: qa-bug-hunter
    checks: true
    sections: [Checklist]
    enforcement: block
    confirm_to_advance: true
    blocks:
      - actions: [commit, pr]
  - id: pr
    name: Commit and PR
    artifact: pr.md
    agent: builder
    enforcement: guide
    confirm_to_advance: false
