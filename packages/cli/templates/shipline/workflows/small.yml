# Small change workflow (a default; edit freely or via /shipline-setup). See feature.yml for field docs.
id: small
name: Small change
description: a typo, rename, config tweak or one-file fix; Claude picks it without asking
stages:
  - id: ticket
    name: Ticket
    artifact: ticket.md
    optional: true
    enforcement: guide
    confirm_to_advance: false
  - id: implement
    name: Implement
    artifact: implementation.md
    agent: builder
    enforcement: guide
    confirm_to_advance: false
  - id: verify
    name: Verify
    artifact: verification.md
    agent: qa-bug-hunter
    checks: true
    sections: [Checklist]
    enforcement: block
    confirm_to_advance: true
    blocks:
      - actions: [commit, pr]
  - id: pr
    name: Commit and PR
    artifact: pr.md
    agent: builder
    enforcement: guide
    confirm_to_advance: false
